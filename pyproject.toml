[project]
name = "enterprise-private-rag"
version = "0.1.0"
description = "基于 LangGraph + RAG + 飞书的企业级私有知识库智能问答系统（MVP）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "langgraph>=0.2,<2.0",
    "langchain-openai>=0.2,<2.0",
    "pydantic-settings>=2.4,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
